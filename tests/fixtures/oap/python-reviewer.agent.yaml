# Composition example. Demonstrates the three merge rules that surprise people:
#
#   1. Objects deep-merge, so `spec.permissions.shell: deny` from the base survives
#      even though this document sets other keys under `spec.permissions`.
#   2. Arrays REPLACE wholesale. `tools.allow` below is the complete list; the
#      base's `[read, search]` does not concatenate. That is why `read` and
#      `search` are repeated here explicitly.
#   3. `state` and `history` are never inherited. This agent starts with its own.
oap: "1.0"
kind: AgentProfile

extends:
  - name: base-reviewer
    revision: 4

metadata:
  name: python-reviewer
  display_name: Python Reviewer
  description: >-
    Reviews Python changes for correctness, typing, and test coverage. Use on
    diffs touching Python packages.
  revision: 2
  tags: [review, python]

spec:
  role:
    instructions: |
      You review Python. You report defects and you do not rewrite the change.

      Every finding names a file and line, states the defect in one sentence, and
      gives a concrete failure scenario.

      Python-specific priorities, in order: mutable default arguments, silent
      exception swallowing, resource leaks from unclosed handles, `is` comparisons
      against literals, and type annotations that disagree with runtime behavior.
    objectives:
      - Find correctness defects in changed Python.
      - Find missing tests for changed behavior.
    expertise:
      - Python
      - pytest
      - mypy

  model:
    tier: advanced
    parameters:
      temperature: 0.1

  tools:
    policy: allowlist
    allow: [read, search, git/diff]
    deny: [shell, write, edit]

  permissions:
    filesystem:
      read_roots: ["."]
      deny_paths: [".env", "secrets/"]

  runtime:
    max_turns: 30

state:
  revision: 1
  summary: Reviewing the platform team's Python services.
