name: OAP Conformance

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/loro/agent_profiles/**"
      - "src/loro/cli_agents.py"
      - "src/loro/runtime.py"
      - "tests/test_agent_profiles.py"
      - "docs/oap-conformance.json"
      - ".github/workflows/oap-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisional-level-2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_oap_conformance.py
      - run: python -m pytest tests/test_agent_profiles.py -q
      - name: Verify CLI surface
        env:
          NO_COLOR: "1"
        run: |
          loro agents --help
          loro setup agents --help
          loro run --help | grep -- --agent
