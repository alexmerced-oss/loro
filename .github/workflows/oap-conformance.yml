name: OAP Conformance

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/loro/agent_profiles/**"
      - "src/loro/cli_agents.py"
      - "src/loro/runtime.py"
      - "tests/test_agent_profiles.py"
      - "docs/oap-conformance.json"
      - ".github/workflows/oap-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level-3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: alexmerced-oss/open-agent-profile
          ref: 7fb633a1a59dd7636ffb0030d254f2f58934f74a
          path: upstream-oap
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_oap_conformance.py
      - run: oap-validate upstream-oap/examples --digest
      - run: python -m pytest tests/test_agent_profiles.py -q
      - name: Verify CLI surface
        run: |
          loro agents --help
          loro setup agents --help
          python -c 'from typer.main import get_command; from loro.cli import app; assert "agent" in {param.name for param in get_command(app).commands["run"].params}'
