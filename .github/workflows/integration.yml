name: Integration

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      postgres:
        description: "Run Postgres Testcontainers integration tests"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      polaris:
        description: "Run Polaris CLI integration tests against a preconfigured runner"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]
      polaris_quickstart:
        description: "Start the official Polaris quickstart stack for service-level CI smoke checks"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  postgres:
    if: ${{ github.event_name == 'schedule' || inputs.postgres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install -e ".[dev,integration]"

      - name: Run Postgres integration tests
        env:
          LORO_INTEGRATION_POSTGRES: "1"
        run: |
          python -m pytest -m integration \
            tests/integration/test_postgres_memory_integration.py \
            tests/integration/test_postgres_recovery_integration.py \
            --junitxml=postgres-integration.xml

      - name: Upload Postgres integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-${{ github.sha }}
          path: postgres-integration.xml
          if-no-files-found: error
          retention-days: 90

  polaris:
    if: ${{ inputs.polaris == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install integration dependencies
        run: python -m pip install -e ".[dev,data]"

      - name: Run Polaris CLI integration tests
        env:
          LORO_INTEGRATION_POLARIS: "1"
        run: |
          python -m pytest -m integration tests/integration/test_polaris_cli_integration.py \
            --junitxml=polaris-cli-integration.xml

      - name: Upload Polaris CLI integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polaris-cli-integration-${{ github.sha }}
          path: polaris-cli-integration.xml
          if-no-files-found: error
          retention-days: 90

  polaris-quickstart:
    if: ${{ github.event_name == 'schedule' || inputs.polaris_quickstart == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install data and seed dependencies
        run: python -m pip install -e ".[dev,data,integration]"

      - name: Download Polaris quickstart compose
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/apache/polaris/refs/tags/apache-polaris-1.6.0/site/content/guides/quickstart/docker-compose.yml \
            -o /tmp/polaris-quickstart.yml
          sed -i 's|apache/polaris:latest|apache/polaris:1.6.0|' /tmp/polaris-quickstart.yml

      - name: Start Polaris quickstart stack
        run: docker compose -p loro-polaris-quickstart -f /tmp/polaris-quickstart.yml up -d

      - name: Wait for Polaris REST API
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.time() + 180
          last_error = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(
                      "http://localhost:8182/q/health", timeout=5
                  ) as response:
                      if response.status == 200:
                          print(f"Polaris responded with HTTP {response.status}")
                          raise SystemExit(0)
              except urllib.error.HTTPError as error:
                  if error.code < 500:
                      print(f"Polaris responded with HTTP {error.code}")
                      raise SystemExit(0)
                  last_error = error
              except Exception as error:
                  last_error = error
                  time.sleep(5)
          raise SystemExit(f"Polaris did not become ready: {last_error}")
          PY

      - name: Create DuckDB seed files
        run: |
          mkdir -p /tmp/loro-ci-seed
          python - <<'PY'
          import duckdb

          connection = duckdb.connect()
          connection.execute("""
              CREATE TABLE seed_memories AS
              SELECT
                  'seed-1' AS memory_id,
                  'acme' AS tenant_id,
                  'team' AS scope_type,
                  'platform' AS scope_key,
                  'Use launch readiness briefs with owners and blockers.' AS content
          """)
          connection.execute("""
              COPY seed_memories
              TO '/tmp/loro-ci-seed/seed_memories.parquet'
              (FORMAT PARQUET)
          """)
          connection.execute("""
              COPY seed_memories
              TO '/tmp/loro-ci-seed/seed_memories.csv'
              (HEADER, DELIMITER ',')
          """)
          print("Wrote /tmp/loro-ci-seed/seed_memories.parquet and .csv")
          rows = connection.execute(
              "SELECT memory_id, tenant_id FROM read_parquet(?)",
              ["/tmp/loro-ci-seed/seed_memories.parquet"],
          ).fetchall()
          assert rows == [("seed-1", "acme")]
          PY

      - name: Run Loro Polaris/Iceberg dry-run checks
        env:
          LORO_CONFIG_CONTENT: |
            [polaris]
            enabled = true
            cli_path = "polaris"
            catalog = "quickstart_catalog"

            [memory.shared]
            enabled = true
            backend = "iceberg"
            iceberg_catalog_name = "polaris_catalog"
            iceberg_catalog_uri_env = "LORO_ICEBERG_CATALOG_URI"
            iceberg_credential_env = "LORO_ICEBERG_CREDENTIAL"
            iceberg_token_env = "LORO_ICEBERG_TOKEN"
            iceberg_warehouse = "quickstart_catalog"
            iceberg_namespace = "agent_memory"
            iceberg_table = "shared_memories"
          LORO_ICEBERG_CATALOG_URI: "http://localhost:8181/api/catalog"
        run: |
          python -m loro memory schema --backend iceberg
          python -m loro memory shared-search "launch readiness" --tenant-id acme --dry-run
          python -m loro memory backend-check

      - name: Record quickstart evidence
        if: success()
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          matrix = json.loads(Path("docs/data-support-matrix.json").read_text())
          evidence = {
              "schema_version": "1.0",
              "commit": os.environ["EVIDENCE_COMMIT"],
              "generated_at": datetime.now(UTC).isoformat(),
              "result": "passed",
              "reference_stack": matrix["reference_stack"],
              "checks": [
                  "polaris_health",
                  "duckdb_parquet_seed",
                  "iceberg_schema_render",
                  "iceberg_search_dry_run",
                  "pyiceberg_backend_check",
              ],
          }
          Path("polaris-quickstart-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload quickstart evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: polaris-quickstart-${{ github.sha }}
          path: polaris-quickstart-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Show Polaris logs on failure
        if: failure()
        run: docker compose -p loro-polaris-quickstart -f /tmp/polaris-quickstart.yml logs --tail=200

      - name: Stop Polaris quickstart stack
        if: always()
        run: docker compose -p loro-polaris-quickstart -f /tmp/polaris-quickstart.yml down -v
