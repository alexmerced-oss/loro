name: Release Evidence

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned build tools
        run: |
          python -m pip install pip==26.2.1 setuptools==84.0.0
          python -m pip install build==1.3.0 twine==6.2.0 cyclonedx-bom==7.3.1

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$package_version"

      - name: Verify signed release tag
        if: github.ref_type == 'tag'
        run: |
          git config gpg.ssh.allowedSignersFile docs/keys/allowed_signers
          git verify-tag "${GITHUB_REF_NAME}"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/loro-release-smoke
          wheel=$(find dist -name 'loro_agent-*.whl' -print -quit)
          /tmp/loro-release-smoke/bin/python -m pip install "${wheel}[gateway]"
          /tmp/loro-release-smoke/bin/loro --version
          /tmp/loro-release-smoke/bin/loro doctor --help
          /tmp/loro-release-smoke/bin/loro config check --help
          /tmp/loro-release-smoke/bin/loro artifacts verify --help
          /tmp/loro-release-smoke/bin/loro credentials --help
          /tmp/loro-release-smoke/bin/loro gateway --help
          /tmp/loro-release-smoke/bin/loro audit query --help
          /tmp/loro-release-smoke/bin/loro audit collect --help
          /tmp/loro-release-smoke/bin/loro audit metrics --help
          /tmp/loro-release-smoke/bin/loro operations recovery-targets
          /tmp/loro-release-smoke/bin/loro operations benchmark \
            --iterations 5 --warmup 1 --strict --output dist/release-benchmark.json
          /tmp/loro-release-smoke/bin/loro operations release-readiness \
            --output dist/release-readiness.json
          /tmp/loro-release-smoke/bin/loro memory migrate --help
          /tmp/loro-release-smoke/bin/loro memory reconcile --help
          /tmp/loro-release-smoke/bin/loro memory sweep --help
          /tmp/loro-release-smoke/bin/loro skills import-claude --help
          /tmp/loro-release-smoke/bin/loro skills import-pi --help
          /tmp/loro-release-smoke/bin/loro providers smoke "hello" --provider mock --execute --stream
          /tmp/loro-release-smoke/bin/loro providers conformance
          mkdir -p /tmp/loro-config-smoke
          cd /tmp/loro-config-smoke
          HOME=/tmp/loro-config-home /tmp/loro-release-smoke/bin/loro configure mock
          HOME=/tmp/loro-config-home /tmp/loro-release-smoke/bin/loro config check --strict
          HOME=/tmp/loro-config-home /tmp/loro-release-smoke/bin/loro docs create \
            "Release verification document" --output-dir /tmp/loro-release-artifacts
          provenance=$(find /tmp/loro-release-artifacts -name '*.provenance.json' -print -quit)
          test -n "$provenance"
          HOME=/tmp/loro-config-home /tmp/loro-release-smoke/bin/loro artifacts verify \
            "$provenance"
          cd "${GITHUB_WORKSPACE}"
          /tmp/loro-release-smoke/bin/loro graph validate \
            docs/examples/agraph/release-readiness.agraph.yaml --strict
          skill_path=$(/tmp/loro-release-smoke/bin/loro graph skill-path)
          /tmp/loro-release-smoke/bin/loro skills validate "$skill_path"
          test -f "$skill_path/references/schema/agentic-graph-1.0.schema.json"

      - name: Generate release SBOM
        run: |
          python -m venv /tmp/loro-release-sbom
          /tmp/loro-release-sbom/bin/python -m pip install pip==26.2.1
          /tmp/loro-release-sbom/bin/python -m pip install dist/loro_agent-*.whl cyclonedx-bom==7.3.1
          /tmp/loro-release-sbom/bin/cyclonedx-py environment \
            --pyproject pyproject.toml --output-reproducible \
            --output-format JSON --output-file dist/release-sbom.cdx.json \
            /tmp/loro-release-sbom/bin/python

      - name: Generate release manifest and checksums
        run: |
          cp docs/support-matrix.json dist/support-matrix.json
          cp docs/data-support-matrix.json dist/data-support-matrix.json
          cp docs/interoperability-matrix.json dist/interoperability-matrix.json
          cp deploy/reference/manifest.json dist/reference-deployment-manifest.json
          cp docs/release-contract.json dist/release-contract.json
          python scripts/generate_release_manifest.py \
            --dist dist --commit "${GITHUB_SHA}" --workflow-run "${GITHUB_RUN_ID}"
          cd dist
          sha256sum loro_agent-* release-benchmark.json release-readiness.json \
            release-contract.json \
            reference-deployment-manifest.json release-sbom.cdx.json support-matrix.json \
            data-support-matrix.json \
            interoperability-matrix.json \
            release-manifest.json > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
