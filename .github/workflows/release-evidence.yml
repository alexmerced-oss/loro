name: Release Evidence

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned build tools
        run: python -m pip install build==1.3.0 twine==6.2.0

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$package_version"

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/loro-release-smoke
          /tmp/loro-release-smoke/bin/python -m pip install dist/loro_agent-*.whl
          /tmp/loro-release-smoke/bin/loro --version
          /tmp/loro-release-smoke/bin/loro providers smoke "hello" --provider mock --execute --stream
          /tmp/loro-release-smoke/bin/loro graph validate \
            docs/examples/agraph/release-readiness.agraph.yaml --strict
          skill_path=$(/tmp/loro-release-smoke/bin/loro graph skill-path)
          /tmp/loro-release-smoke/bin/loro skills validate "$skill_path"
          test -f "$skill_path/references/schema/agentic-graph-1.0.schema.json"

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
