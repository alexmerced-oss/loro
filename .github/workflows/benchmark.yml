name: Enterprise Beta Benchmark

on:
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Loro
        run: python -m pip install -e .

      - name: Run content-free benchmark gate
        run: loro operations benchmark --iterations 50 --warmup 5 --strict --output loro-benchmark.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enterprise-beta-benchmark-${{ github.sha }}
          path: loro-benchmark.json
          if-no-files-found: error
          retention-days: 90
