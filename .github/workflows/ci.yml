name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      # Lenient mypy baseline from pyproject.toml. The per-module ignore list is a
      # backlog that tests/test_type_check_ratchet.py only lets shrink.
      - name: Type check
        run: python -m mypy

      - name: Verify governance inventories
        run: |
          python scripts/check_audit_inventory.py
          python scripts/check_enterprise_evidence.py
          python scripts/check_data_support_matrix.py
          python scripts/check_interoperability_matrix.py
          python scripts/check_reference_deployment.py
          python scripts/generate_release_contract.py --check

      # Advisory on branches and pull requests (a version bump may be in progress);
      # the release-evidence workflow runs the same check with --strict on tags.
      - name: Check release metadata
        run: python scripts/check_release_metadata.py

      - name: Test with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Compile Python files
        run: python -m compileall src tests

  windows-recovery:
    name: Windows recovery ownership
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --no-cov tests/test_process_liveness.py
