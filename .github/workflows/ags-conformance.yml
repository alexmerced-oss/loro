name: AGS Conformance

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/loro/agraph/**"
      - "src/loro/cli_graph.py"
      - "tests/test_agraph.py"
      - "tests/fixtures/agraph/**"
      - ".github/workflows/ags-conformance.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 2"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: AlexMercedCoder/agentic-graph-spec
          ref: f180a4dbd07911f90dd0821f531d7ccd51bb0764
          path: upstream-ags
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify immutable upstream examples
        run: ags-validate upstream-ags/examples --strict
      - run: python -m pytest tests/test_agraph.py -q
      - name: Validate Loro examples strictly
        run: |
          for graph in docs/examples/agraph/*.agraph.yaml skills/agentic-graph/references/templates/*.agraph.yaml; do
            loro graph validate "$graph" --strict
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ags-conformance-py${{ matrix.python-version }}
          path: .loro/graph-runs
          if-no-files-found: ignore
