[model]
provider = "mock"
model = "mock-agent"
small_model = "mock-small"
timeout_seconds = 120
temperature = 0.2

[permissions]
default = "ask"
shell = "ask"
edit = "ask"
web = "deny"

[memory.local]
enabled = true
path = ".loro/memory"
auto_propose = true

[memory.shared]
enabled = false
backend = "postgres"
write_policy = "explicit_user_dictation_only"
read_policy = "semantic_retrieval_with_citations"

[polaris]
enabled = false
cli_path = "polaris"
require_role_inspection = true

[audit]
enabled = true
path = ".loro/audit.jsonl"
include_prompt_preview = true

[sessions]
path = ".loro/sessions"

[safety]
enabled = true
block_on_findings = true
