[build-system]
requires = ["hatchling>=1.25,<1.28"]
build-backend = "hatchling.build"

[project]
name = "loro-agent"
version = "0.7.0"
description = "Enterprise memory-sharing CLI agent harness for coding, governed data, and productivity work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Merced" }]
keywords = ["agents", "cli", "enterprise", "memory", "iceberg", "polaris"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Software Development",
  "Topic :: System :: Shells",
]
dependencies = [
  "click>=8.1",
  "typer>=0.12.5",
  "rich>=13.9.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "tomli-w>=1.0.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "xlsxwriter>=3.2.0",
  "PyYAML>=6.0.2",
  "jsonschema>=4.23.0",
  "keyring>=25.6.0",
  "cryptography>=50.0.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
artifacts = [
  "pandas>=2.2.0",
]
data = [
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.0",
  "pyiceberg>=0.11.1,<0.12",
  "pyarrow>=17.0.0",
]
aws = [
  "boto3>=1.34.0",
]
mcp = [
  "mcp>=2.0,<3",
]
gateway = [
  "cryptography>=50.0.0",
]
integration = [
  "duckdb==1.5.5",
  "psycopg[binary]>=3.2.0",
  "testcontainers[postgres]>=4.8.0",
]
dev = [
  "coverage[toml]>=7.6.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
  "mcp>=2.0,<3",
  "skills-ref==0.1.1",
]

[project.scripts]
loro = "loro.cli:app"

[project.urls]
Homepage = "https://github.com/alexmerced-oss/loro"
Documentation = "https://github.com/alexmerced-oss/loro/tree/main/docs"
Repository = "https://github.com/alexmerced-oss/loro"
Issues = "https://github.com/alexmerced-oss/loro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loro"]

[tool.hatch.build.targets.wheel.force-include]
"skills/agentic-graph" = "loro/bundled_skills/agentic-graph"
"docs/interoperability-matrix.json" = "loro/contracts/interoperability-matrix.json"
"tests/fixtures/providers" = "loro/contracts/providers"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.loro",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/loro/agraph/reference_validator.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require local containers or external services",
]

[tool.coverage.run]
branch = true
source = ["loro"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
